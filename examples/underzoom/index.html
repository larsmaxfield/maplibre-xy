<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Underzoom and overpan with custom map transform</title>
    <meta property='og:description' content='Underzoom and overpan with a custom map transform' />
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.10.0/dist/maplibre-gl.js'></script>
    <style>
        h1 {
            font-size: 1rem;
        }
        body {
            margin: 0;
            padding: 0;
            background: repeating-conic-gradient(#000 0 25%, #444 0 50%) 50% / 32px 32px;
        }
        html, body, #map { height: 100%; }
        .listing-group {
            font-family: 'Helvetica Neue', Arial, Helvetica, sans-serif;
            background-color: #fff;
            padding: 5px;
            border-radius: 4px;
        }
        #options {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        h1 {
            margin: 0.25rem;
        }
    </style>
</head>
<body>
<div id='map'></div>
<table id='options' class='listing-group'>
    <tr><th scope="col" colspan="100%">
        <h1>
            Underzoom.transformConstrain (<a href=https://github.com/larsmaxfield/maplibre-xy/tree/main/src/underzoom target="_top">source</a>)
        </h1>
    </th></tr>
    <tr><td><label for='extend-viewport-bounds'>Extend viewport bounds</label></td><td><input type='checkbox' id='extend-viewport-bounds' checked/></td></tr>
    <tr><td><label for='extend-scale-slider' id='extend-scale-label'>Extend scale</label></td><td><input type='range' id='extend-scale-slider' min='0' max='100' step='10' value='90' /></td></tr>
    <tr><td><label for='extend-pan-slider' id='extend-pan-label'>Extend pan</label></td><td><input type='range' id='extend-pan-slider' min='0' max='100' step='10' value='20' /></td></tr>
    <tr><td><label for='max-bounds-select'>maxBounds</label></td>
        <td><select name="max-bounds-select" id="max-bounds-select">
            <option value="undefined">World (undefined)</option>
            <option value="wide">Amazon River (wide)</option>
            <option value="tall">Lake Michigan (tall)</option>
        </select></td>
    </tr>
</table>

<script type="module">
    import { Underzoom } from '../../src/index.js';  // or '../../src/underzoom.js'
    
    const myUnderzoom = new Underzoom(maplibregl);
    
    const wayOut = -999;

    const map = new maplibregl.Map({
        container: 'map',
        zoom: wayOut,
        renderWorldCopies: false,
        transformConstrain: myUnderzoom.transformConstrain,
        style: {
            version: 8,
            sources: {
                rgb: {
                    type: 'raster',
                    tiles: ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
                    tileSize: 256,
                    attribution: '&copy; OpenStreetMap Contributors',
                    maxzoom: 19
                },
            },
            layers: [
                {
                    id: 'rgb',
                    type: 'raster',
                    source: 'rgb'
                },
            ]
        },
    });

    // Lake Michigan
    const t_north = 46.11;
    const t_east = -84.72;
    const t_south = 41.60;
    const t_west = -88.05;
    const t_bounds = [[t_west, t_south], [t_east, t_north]];
    const t_center = [(t_west + t_east) / 2, (t_north + t_south) / 2]
    
    // Amazon River
    const w_north = 0.71;
    const w_east = -50.09;
    const w_south = -5.10;
    const w_west = -75.10;
    const w_bounds = [[w_west, w_south], [w_east, w_north]];
    const w_center = [(w_west + w_east) / 2, (w_north + w_south) / 2]

    // // New York, New York
    // const w_north = 40.78;
    // const w_east = -73.81;
    // const w_south = 40.68;
    // const w_west = -74.15;
    // const w_bounds = [[w_west, w_south], [w_east, w_north]];
    // const w_center = [(w_west + w_east) / 2, (w_north + w_south) / 2]

    // // Amsterdam, Netherlands
    // const t_north = 52.3676 + 0.5;
    // const t_east = 4.9041 + 0.25;
    // const t_south = 52.3676 - 0.5;
    // const t_west = 4.9041 - 0.25;
    // const t_bounds = [[t_west, t_south], [t_east, t_north]];
    // const t_center = [(t_west + t_east) / 2, (t_north + t_south) / 2]

    const bounds_options = {
        "undefined": {
            "bounds": undefined, "center": [0, 0]
        },
        "wide": {
            "bounds": w_bounds, "center": w_center
        },
        "tall": {
            "bounds": t_bounds, "center": t_center
        },
    }

    const zeroPad = (num, places) => String(num).padStart(places, '0');
    function setExtendScaleFromUi() {
        myUnderzoom.extend = document.getElementById('extend-viewport-bounds').checked;
        const extendScale = parseFloat(document.getElementById('extend-scale-slider').value);
        myUnderzoom.extendScale = extendScale / 100;
        document.getElementById('extend-scale-label').textContent = `Extend scale (${zeroPad(extendScale, 2)}%)`;
        map.setZoom(wayOut);
    }
    function setExtendPanFromUi() {
        const extendPan = parseFloat(document.getElementById('extend-pan-slider').value);
        myUnderzoom.extendPan = extendPan / 100;
        document.getElementById('extend-pan-label').textContent = `Extend pan (${zeroPad(extendPan, 2)}%)`;
        map.resize();
    }
    function selectMaxBoundsFromUi() {
        const option = document.getElementById('max-bounds-select').value;
        map.setMaxBounds(bounds_options[option].bounds);
        map.setCenter(bounds_options[option].center);
        map.setZoom(wayOut);
    }

    map.on('load', () => {
        map.addSource('bounds-wide', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'properties': {},
                'geometry': {
                    'type': 'LineString',
                    'coordinates': [
                        [w_west, w_south],
                        [w_west, w_north],
                        [w_east, w_north],
                        [w_east, w_south],
                        [w_west, w_south],
                    ]
                }
            }
        });
        map.addLayer({
            'id': 'bounds-wide',
            'type': 'line',
            'source': 'bounds-wide',
            'paint': {
                'line-color': '#ff0000',
                'line-width': 4,
                'line-offset': -2,
            }
        });
        map.addSource('bounds-tall', {
            'type': 'geojson',
            'data': {
                'type': 'Feature',
                'properties': {},
                'geometry': {
                    'type': 'LineString',
                    'coordinates': [
                        [t_west, t_south],
                        [t_west, t_north],
                        [t_east, t_north],
                        [t_east, t_south],
                        [t_west, t_south],
                    ]
                }
            }
        });
        map.addLayer({
            'id': 'bounds-tall',
            'type': 'line',
            'source': 'bounds-tall',
            'paint': {
                'line-color': '#ff0000',
                'line-width': 4,
                'line-offset': -2,
            }
        });
        document.getElementById('extend-viewport-bounds').addEventListener('change', setExtendScaleFromUi);
        document.getElementById('extend-scale-slider').addEventListener('input', setExtendScaleFromUi);
        document.getElementById('extend-pan-slider').addEventListener('input', setExtendPanFromUi);
        document.getElementById('max-bounds-select').addEventListener('change', selectMaxBoundsFromUi);
        setExtendScaleFromUi();
        setExtendPanFromUi();
        selectMaxBoundsFromUi();
    });
</script>
</body>
</html>
